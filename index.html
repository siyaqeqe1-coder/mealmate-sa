<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pot & Plan</title>
<meta name="theme-color" content="#0f0b0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-1.png">
<link rel="apple-touch-icon" href="apple-touch-icon-1.png">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header>
  <img src="icon-192-1.png" alt="Pot and Plan" onerror="this.style.display='none';document.getElementById('hname').style.display='block'">
  <h1 id="hname">Pot &amp; Plan</h1>
</header>
<main id="app">Loading recipes…</main>
<nav>
  <button id="navHome">🍲 Recipes</button>
  <button id="navCart">🛒 Shopping list <span id="count"></span></button>
</nav>
<script>
window.onerror = function (m, s, l) {
  document.getElementById("app").innerHTML = "<p>Something went wrong.</p><p>" + m + " (" + s + ":" + l + ")</p>";
};
</script>
<script src="core.js?v=1"></script>
<script src="list.js?v=1"></script>
<script src="cart.js?v=1"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
