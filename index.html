<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MealMate SA</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; background: #f6faf5; color: #1d3a24; }
  header { background: #2e7d32; color: white; padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 22px; }
  main { padding: 16px; max-width: 700px; margin: 0 auto; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #b7d3b9; border-radius: 10px; margin-bottom: 12px; }
  .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); cursor: pointer; }
  .card h3 { margin: 0 0 6px; }
  .meta { color: #557a5b; font-size: 14px; }
  .badge { display: inline-block; background: #fff3cd; color: #7a5b00; font-size: 12px; padding: 3px 8px; border-radius: 20px; margin-top: 6px; }
  .badge.ok { background: #d9f2dc; color: #1d5a24; }
  button { background: #2e7d32; color: white; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 16px; margin-bottom: 12px; }
  h2 { margin-top: 4px; }
  li { margin-bottom: 6px; }
  .note { background: #fff; border-left: 4px solid #2e7d32; padding: 10px; margin: 10px 0; border-radius: 6px; }
</style>
</head>
<body>
<header><h1>MealMate SA</h1></header>
<main id="app">Loading recipes…</main>

<script>
const SUPABASE_URL = "https://vswrxwwbwjosfxqcgxds.supabase.co";
const SUPABASE_KEY = "sb_publishable_0-RQ-3ZNZ0o39VvlklXQxw_1oMMt8Xy";

const STATUS = {
  draft: "Draft",
  ai_assisted_unverified: "AI-assisted, not yet tested",
  kitchen_tested: "Kitchen tested",
  chef_reviewed: "Chef reviewed"
};

let recipes = [];
const app = document.getElementById("app");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function textOf(x) {
  if (x == null) return "";
  if (typeof x === "string") return x;
  if (typeof x === "object") return x.text || x.step || x.instruction || x.description || x.name || JSON.stringify(x);
  return String(x);
}

function listOf(x) {
  if (!x) return [];
  if (Array.isArray(x)) return x.map(textOf).filter(Boolean);
  if (typeof x === "object") return Object.entries(x).map(([k, v]) => k + ": " + textOf(v));
  return [textOf(x)];
}

async function load() {
  const select = "id,title,slug,description,cuisine,difficulty,prep_minutes,cook_minutes,base_servings,instructions,verification_status,allergen_notes,storage_notes,substitutions,recipe_ingredients(quantity,unit,preparation,is_optional,sort_order,ingredients(name))";
  const url = SUPABASE_URL + "/rest/v1/recipes?select=" + select + "&is_published=eq.true&order=title";
  try {
    const res = await fetch(url, { headers: { apikey: SUPABASE_KEY } });
    if (!res.ok) throw new Error("Server said " + res.status + ": " + (await res.text()));
    recipes = await res.json();
    showList();
  } catch (e) {
    app.innerHTML = "<p>Sorry, recipes could not load.</p><p class='meta'>" + esc(e.message) + "</p>";
  }
}

function badge(r) {
  const ok = r.verification_status === "kitchen_tested" || r.verification_status === "chef_reviewed";
  return "<span class='badge " + (ok ? "ok" : "") + "'>" + esc(STATUS[r.verification_status] || r.verification_status) + "</span>";
}

function showList(filter = "") {
  const q = filter.toLowerCase();
  const shown = recipes.filter(r => (r.title + " " + (r.description || "") + " " + (r.cuisine || "")).toLowerCase().includes(q));
  let html = "<input id='search' placeholder='Search recipes…' value='" + esc(filter) + "'>";
  if (!recipes.length) html += "<p>No recipes are published yet. Check back soon!</p>";
  else if (!shown.length) html += "<p>No recipes match your search.</p>";
  html += shown.map(r =>
    "<div class='card' data-id='" + esc(r.id) + "'><h3>" + esc(r.title) + "</h3>" +
    "<div class='meta'>" + esc(r.cuisine || "") + " · " + esc(r.difficulty || "") + " · " +
    ((r.prep_minutes || 0) + (r.cook_minutes || 0)) + " min</div>" + badge(r) + "</div>"
  ).join("");
  app.innerHTML = html;
  const s = document.getElementById("search");
  s.addEventListener("input", () => { showList(s.value); const n = document.getElementById("search"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  app.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => showRecipe(c.dataset.id)));
}

function showRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const ings = (r.recipe_ingredients || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  let html = "<button id='back'>← Back</button><h2>" + esc(r.title) + "</h2>" + badge(r);
  html += "<p>" + esc(r.description || "") + "</p>";
  html += "<p class='meta'>Prep " + (r.prep_minutes ?? "?") + " min · Cook " + (r.cook_minutes ?? "?") + " min · Serves " + (r.base_servings ?? "?") + " · " + esc(r.difficulty || "") + "</p>";
  html += "<h3>Ingredients</h3><ul>" + ings.map(i =>
    "<li>" + esc([i.quantity, i.unit, i.ingredients && i.ingredients.name].filter(x => x != null && x !== "").join(" ")) +
    (i.preparation ? ", " + esc(i.preparation) : "") + (i.is_optional ? " (optional)" : "") + "</li>").join("") + "</ul>";
  html += "<h3>Method</h3><ol>" + listOf(r.instructions).map(s => "<li>" + esc(s) + "</li>").join("") + "</ol>";
  const subs = listOf(r.substitutions);
  if (subs.length) html += "<h3>Substitutions</h3><ul>" + subs.map(s => "<li>" + esc(s) + "</li>").join("") + "</ul>";
  if (r.allergen_notes) html += "<div class='note'><b>Allergens:</b> " + esc(r.allergen_notes) + "</div>";
  if (r.storage_notes) html += "<div class='note'><b>Storage:</b> " + esc(r.storage_notes) + "</div>";
  app.innerHTML = html;
  document.getElementById("back").addEventListener("click", () => showList());
  window.scrollTo(0, 0);
}

load();
</script>
</body>
</html>
